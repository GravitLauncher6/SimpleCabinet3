spring:
  application:
    name: simplecabinet

  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 256MB
  
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password: 
  
  h2:
    console:
      enabled: false
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

jwt:
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  private-key-file: ${JWT_PRIVATE_KEY_FILE:}
  public-key-file: ${JWT_PUBLIC_KEY_FILE:}
  expiration: 86400000
  session-expiration: 604800000

# Optional external authentication. No provider connection or request is made while disabled.
external-auth:
  enabled: false
  provider-id: default
  # Use long random secrets from environment variables in production.
  state-encryption-secret: ${EXTERNAL_AUTH_STATE_SECRET:change-me-before-enabling}
  credential-fingerprint-secret: ${EXTERNAL_AUTH_FINGERPRINT_SECRET:change-me-before-enabling}
  oauth:
    callback-url: http://localhost:8080/auth/oauth/callback/{providerId}
  type: SQL # SQL or HTTP
  sql:
    jdbc-url: jdbc:postgresql://localhost:5432/external_users
    username: external_auth
    password: ""
    driver-class-name: "" # Usually auto-detected from the JDBC URL
    table: users
    subject-column: id
    username-column: username
    password-column: password
    email-column: email
    roles-column: roles
    enabled-column: enabled
    role-separator: ","
    password-encoding: BCRYPT # BCRYPT or PLAIN
  http:
    base-url: http://localhost:8081
    authenticate-endpoint: /auth/login
    refresh-endpoint: /auth/refresh
    connect-timeout: 5s
    read-timeout: 10s
    headers: {}
    fields:
      username-request: username
      password-request: password
      refresh-token-request: refreshToken
      subject-response: id
      success-response: success
      username-response: username
      email-response: email
      roles-response: roles
      error-response: errorMessage
      refresh-token-response: refreshToken
      access-token-response: accessToken

# Storage configuration
storage:
  # Type of storage: LOCAL or S3
  type: LOCAL
  
  # Local file storage configuration
  local:
    path: uploads
    base-url: http://localhost:8080/files
  
  # S3 storage configuration (for S3-compatible services like AWS S3, MinIO, etc.)
  s3:
    access-key: your-access-key
    secret-key: your-secret-key
    region: us-east-1
    bucket: your-bucket-name
    prefix: ""  # Optional prefix for all files
    endpoint: ""  # Optional custom endpoint for S3-compatible services (e.g., http://localhost:9000 for MinIO)
